[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-vacuum"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "Jordan Kanter", email = "jikanter@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "lark>=1.3.1",
]

[project.urls]
Documentation = "https://github.com/jikanter/content-vacuum#readme"
Issues = "https://github.com/jikanter/content-vacuum/issues"
Source = "https://github.com/jikanter/content-vacuum"

[tool.hatch.version]
path = "src/content_vacuum/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/content_vacuum tests}"

[tool.coverage.run]
source_pkgs = ["content_vacuum", "tests"]
branch = true
parallel = true
omit = [
  "src/content_vacuum/__about__.py",
]

[tool.coverage.paths]
content_vacuum = ["src/content_vacuum", "*/content-vacuum/src/content_vacuum"]
tests = ["tests", "*/content-vacuum/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
